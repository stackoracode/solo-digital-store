{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1 class="h2">{{ t('mfa.title') }}</h1>
  {% if error %}<div class="alert">{{ t('error.' ~ error) }}</div>{% endif %}
  <form method="post" action="/account/mfa">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t('mfa.code') }}<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></label>
    <button class="btn btn-primary btn-block">{{ t('login.verify') }}</button>
  </form>
</section>
{% endblock %}
